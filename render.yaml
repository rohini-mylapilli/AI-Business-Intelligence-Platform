services:
  - type: web
    name: AI-Business-Intelligence-Platform
    runtime: python
    plan: free
    region: virginia
    buildCommand: bash build.sh
    startCommand: gunicorn backend.wsgi:application

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-business-db
          property: connectionString

      - key: DEBUG
        value: "False"

      - key: DJANGO_SECRET_KEY
        generateValue: true

databases:
  - name: ai-business-db
    plan: free
    region: virginia