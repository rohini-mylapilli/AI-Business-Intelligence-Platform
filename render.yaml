services:
  - type: web
    name: AI-Business-Intelligence-Platform
    runtime: python
    plan: free
    region: virginia
    buildCommand: bash build.sh
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-business-db
          property: connectionString

      - key: DEBUG
        value: "False"

      - key: ALLOWED_HOSTS
        value: "ai-business-intelligence-platform-0fkp.onrender.com"

      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DJANGO_SUPERUSER_USERNAME
        value: "Rohini01"

      - key: DJANGO_SUPERUSER_EMAIL
        value: "rohini@example.com"

      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true

databases:
  - name: ai-business-db
    plan: free
    region: virginia